<style>
  :root {
    --yellow: #FCD116;
    --blue: #003893;
    --red: #CE1126;
    --ink: #1a1414;
    --paper: #ffffff;
    --muted: #6d6666;
    --rule: #e4dfdf;
    --wide: "Archivo", "Arial Black", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--yellow);
    color: var(--ink);
    font-family: var(--wide);
    overflow-x: hidden;
  }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
  a { color: inherit; }

  .page {
    max-width: 680px;
    min-height: 100vh;
    min-height: 100dvh;
    margin: 0 auto;
    background: var(--paper);
    border-left: 1px solid var(--ink);
    border-right: 1px solid var(--ink);
    padding: 28px 26px 22px;
    display: flex;
    flex-direction: column;
  }

  /* Header */
  header { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
  h1 {
    font-family: var(--wide);
    font-weight: 900;
    font-stretch: 125%;
    font-variation-settings: "wdth" 125;
    font-size: clamp(38px, 10.5vw, 62px);
    line-height: .9;
    letter-spacing: -.02em;
    text-transform: uppercase;
  }
  .sound {
    font-family: var(--mono); font-weight: 600; font-size: 12px; letter-spacing: .12em;
    text-transform: uppercase; white-space: nowrap;
    border: 1px solid var(--ink); padding: 6px 10px; margin-top: 2px;
  }
  .sound:hover { background: var(--ink); color: #fff; }

  /* Flag + crop marks */
  .stage { position: relative; margin-top: 30px; }
  .mark { position: absolute; width: 0; height: 0; pointer-events: none; }
  .mark::before, .mark::after { content: ""; position: absolute; background: var(--ink); }
  .mark::before { width: 12px; height: 1px; }   /* horizontal tick */
  .mark::after  { width: 1px; height: 12px; }   /* vertical tick */
  .mark.tl { top: 0; left: 0; }
  .mark.tl::before { left: -18px; top: 0; }  .mark.tl::after { top: -18px; left: 0; }
  .mark.tr { top: 0; right: 0; }
  .mark.tr::before { right: -18px; top: 0; } .mark.tr::after { top: -18px; right: 0; }
  .mark.bl { bottom: 0; left: 0; }
  .mark.bl::before { left: -18px; bottom: 0; } .mark.bl::after { bottom: -18px; left: 0; }
  .mark.br { bottom: 0; right: 0; }
  .mark.br::before { right: -18px; bottom: 0; } .mark.br::after { bottom: -18px; right: 0; }

  .flag {
    position: relative;
    width: 100%;
    aspect-ratio: 3 / 2;
    outline: 1px solid var(--ink);
    overflow: hidden;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    background: var(--yellow);
  }
  .flag .stripe { position: absolute; left: 0; right: 0; }
  .flag .y { top: 0; background: var(--yellow); }
  .flag .b { background: var(--blue); }
  .flag .r { bottom: 0; background: var(--red); }
  .flag.anim .stripe { transition: top .7s cubic-bezier(.2,.8,.2,1), height .7s cubic-bezier(.2,.8,.2,1); }

  .handle {
    position: absolute; left: 0; right: 0; height: 44px;
    transform: translateY(-50%);
    cursor: ns-resize; display: none; outline: none;
  }
  .flag.playing .handle { display: block; }
  .handle::before {
    content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 3px;
    transform: translateY(-50%);
    background-image: repeating-linear-gradient(90deg, var(--ink) 0 14px, #fff 14px 22px);
  }
  .handle .grip {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    background: var(--ink); color: #fff;
    font-family: var(--mono); font-weight: 600; font-size: 12px; letter-spacing: .12em; text-transform: uppercase;
    padding: 7px 11px; white-space: nowrap;
  }
  .handle:focus-visible .grip { outline: 2px solid #fff; outline-offset: 2px; }
  .handle.dragging .grip { background: #fff; color: var(--ink); }

  .ghost, .yours { position: absolute; left: 0; right: 0; height: 0; display: none; pointer-events: none; }
  .ghost { top: 50%; border-top: 3px dashed #fff; }
  .yours { border-top: 3px solid var(--ink); }
  .ghost span, .yours span {
    position: absolute; font-family: var(--mono); font-weight: 600; font-size: 11px;
    letter-spacing: .12em; text-transform: uppercase; padding: 4px 8px;
  }
  .ghost span { right: 10px; top: 6px; background: #fff; color: var(--ink); }
  .yours span { left: 10px; top: -27px; background: var(--ink); color: #fff; }
  .flag.done .ghost, .flag.done .yours { display: block; }

  /* Bottom area */
  .spacer { flex: 1; min-height: 48px; }
  .lead {
    font-weight: 800;
    font-stretch: 105%;
    font-variation-settings: "wdth" 105;
    font-size: clamp(22px, 5.6vw, 34px);
    line-height: 1.15;
    letter-spacing: -.01em;
  }
  .btn {
    display: flex; justify-content: space-between; align-items: center; width: 100%;
    margin-top: 26px; padding: 18px 24px;
    background: var(--yellow);
    border: 1px solid var(--ink);
    font-weight: 900; font-stretch: 125%; font-variation-settings: "wdth" 125;
    font-size: clamp(30px, 7.4vw, 46px); line-height: 1; text-transform: uppercase; letter-spacing: -.01em;
    transition: background .12s, color .12s;
  }
  .btn:hover { background: var(--ink); color: var(--yellow); }
  .btn .arr { font-weight: 600; font-stretch: 100%; font-variation-settings: "wdth" 100; font-size: .7em; }
  .btn.small { font-size: clamp(15px, 4vw, 24px); padding: 16px 14px; margin-top: 0; gap: 8px; white-space: nowrap; }
  .btn.ghostbtn { background: #fff; }
  .btn.ghostbtn:hover { background: var(--ink); color: #fff; }
  [hidden] { display: none !important; }

  /* Result */
  .label { font-family: var(--mono); font-weight: 600; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; }
  .score {
    font-weight: 900; font-stretch: 125%; font-variation-settings: "wdth" 125;
    font-size: clamp(56px, 15vw, 92px); line-height: 1; letter-spacing: -.03em;
    margin: 8px 0 10px; font-variant-numeric: tabular-nums;
  }
  .verdict { font-weight: 700; font-size: clamp(17px, 4vw, 21px); line-height: 1.25; }
  .stats { margin-top: 18px; border-top: 1px solid var(--ink); font-family: var(--mono); font-size: 13px; }
  .stats div { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--rule); }
  .stats dt { color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
  .stats dd { font-weight: 600; font-variant-numeric: tabular-nums; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  .grid2.first { margin-top: 20px; }
  .share {
    display: flex; justify-content: space-between; align-items: center;
    border: 1px solid var(--ink); padding: 12px 14px;
    font-family: var(--mono); font-weight: 600; font-size: 12px; letter-spacing: .1em; text-transform: uppercase;
  }
  .share:hover { background: var(--ink); color: #fff; }

  footer {
    margin-top: 36px;
    display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    font-family: var(--mono); font-size: 12px;
  }
  footer b { font-weight: 600; }
  footer a { text-decoration: none; font-weight: 600; }
  footer a:hover { text-decoration: underline; }

  @media (max-width: 520px) {
    body { padding: 0 12px; }
    .page { padding: 24px 20px 18px; }
    header { gap: 10px; }
    h1 { font-size: 7.6vw; }
    .sound { font-size: 10px; padding: 5px 7px; letter-spacing: .08em; }
  }

  .confetti { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
  @media (prefers-reduced-motion: reduce) { .flag.anim .stripe { transition: none; } }
</style>
</head>
<body>
<div class="page">
  <header>
    <h1>Ajusta el<br>amarillo.</h1>
    <button class="sound" id="soundBtn" aria-pressed="true">Sonido: <span id="soundLbl">Sí</span></button>
  </header>

  <div class="stage">
    <div class="flag" id="flag" aria-label="Bandera de Colombia">
      <div class="stripe y" id="sY"></div>
      <div class="stripe b" id="sB"></div>
      <div class="stripe r" id="sR"></div>
      <div class="yours" id="yours"><span>Tú</span></div>
      <div class="ghost"><span>Real</span></div>
      <div class="handle" id="handle" role="slider" tabindex="0"
           aria-label="Proporción del amarillo" aria-valuemin="5" aria-valuemax="95" aria-valuenow="33">
        <div class="grip">↕ Arrastra</div>
      </div>
    </div>
    <span class="mark tl"></span><span class="mark tr"></span>
    <span class="mark bl"></span><span class="mark br"></span>
  </div>

  <div class="spacer"></div>

  <section aria-live="polite">
    <!-- intro + playing -->
    <div id="ask">
      <p class="lead" id="lead">Ajusta la franja amarilla hasta donde crees que va en la bandera.</p>
      <button class="btn" id="playBtn">Jugar <span class="arr">→</span></button>
      <button class="btn" id="doneBtn" hidden>Listo <span class="arr">→</span></button>
    </div>

    <!-- result -->
    <div id="result" hidden>
      <div class="label">Precisión</div>
      <div class="score" id="score">0,00%</div>
      <p class="verdict" id="verdict"></p>
      <dl class="stats">
        <div><dt>Desviación</dt><dd id="dev">—</dd></div>
        <div><dt>Tu amarillo</dt><dd id="mine">—</dd></div>
        <div><dt>Tu récord</dt><dd id="best">—</dd></div>
      </dl>
      <div class="grid2 first">
        <button class="share" id="shareX">Compartir en X <span>↗</span></button>
        <button class="share" id="shareWa">WhatsApp <span>↗</span></button>
      </div>
      <div class="grid2">
        <button class="btn small ghostbtn" id="saveBtn">Guardar <span class="arr">↓</span></button>
        <button class="btn small" id="againBtn">Otra vez <span class="arr">→</span></button>
      </div>
    </div>
  </section>

  <footer>
    <a href="https://x.com/elithpalomino" target="_blank" rel="noopener">@elithpalomino</a>
    <span>Inspirado en <a href="https://centra-el-sol.vercel.app/" target="_blank" rel="noopener">Centrá el Sol</a> y <a href="https://elescudo.es/" target="_blank" rel="noopener">Pon el Escudo</a></span>
  </footer>
</div>

<script>
(() => {
  const TRUE_Y = 0.5;          // yellow = 50% of the flag height (2:1:1)
  const MIN = 0.05, MAX = 0.95;
  const $ = (id) => document.getElementById(id);
  const flag = $("flag"), handle = $("handle");
  const sY = $("sY"), sB = $("sB"), sR = $("sR");
  const fmt = (n, d = 2) => n.toLocaleString("es-CO", { minimumFractionDigits: d, maximumFractionDigits: d });

  let y = 1 / 3, state = "idle", lastScore = 0, rounds = 0;

  // ---------- storage (best score) ----------
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };
  let best = parseFloat(store.get("bc-best")) || 0;
  let soundOn = store.get("bc-sound") !== "0";

  // ---------- sound ----------
  let ctx;
  function beep(freq = 440, dur = 0.06, type = "square", vol = 0.04) {
    if (!soundOn) return;
    try {
      ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(vol, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);
      o.connect(g).connect(ctx.destination);
      o.start(); o.stop(ctx.currentTime + dur);
    } catch {}
  }
  function fanfare(score) {
    const notes = score >= 90 ? [523, 659, 784, 1047] : score >= 60 ? [440, 554, 659] : [330, 262];
    notes.forEach((f, i) => setTimeout(() => beep(f, 0.14, "triangle", 0.06), i * 110));
  }
  function renderSound() {
    $("soundLbl").textContent = soundOn ? "Sí" : "No";
    $("soundBtn").setAttribute("aria-pressed", soundOn);
  }
  $("soundBtn").onclick = () => { soundOn = !soundOn; store.set("bc-sound", soundOn ? "1" : "0"); renderSound(); beep(660); };

  // ---------- rendering ----------
  function paint(val) {
    const rest = 1 - val;
    sY.style.height = val * 100 + "%";
    sB.style.top = val * 100 + "%";
    sB.style.height = rest / 2 * 100 + "%";
    sR.style.height = rest / 2 * 100 + "%";
    handle.style.top = val * 100 + "%";
    handle.setAttribute("aria-valuenow", Math.round(val * 100));
  }
  function renderBest() { $("best").textContent = best ? fmt(best) + "%" : "—"; }

  // ---------- dragging ----------
  let lastTick = 0;
  function setFromClientY(clientY) {
    const r = flag.getBoundingClientRect();
    y = Math.min(MAX, Math.max(MIN, (clientY - r.top) / r.height));
    paint(y);
    const step = Math.round(y * 50);
    if (step !== lastTick) { lastTick = step; beep(300 + y * 500, 0.025, "square", 0.02); }
  }
  flag.addEventListener("pointerdown", (e) => {
    if (state !== "playing") return;
    flag.setPointerCapture(e.pointerId);
    handle.classList.add("dragging");
    setFromClientY(e.clientY);
  });
  flag.addEventListener("pointermove", (e) => {
    if (state !== "playing" || !flag.hasPointerCapture(e.pointerId)) return;
    setFromClientY(e.clientY);
  });
  const endDrag = () => handle.classList.remove("dragging");
  flag.addEventListener("pointerup", endDrag);
  flag.addEventListener("pointercancel", endDrag);
  handle.addEventListener("keydown", (e) => {
    if (state !== "playing") return;
    const d = e.shiftKey ? 0.05 : 0.005;
    if (e.key === "ArrowUp") y -= d;
    else if (e.key === "ArrowDown") y += d;
    else if (e.key === "Enter") return finish();
    else return;
    e.preventDefault();
    y = Math.min(MAX, Math.max(MIN, y));
    paint(y); beep(300 + y * 500, 0.025, "square", 0.02);
  });

  // ---------- game flow ----------
  function start() {
    state = "playing"; rounds++;
    // random start, avoiding a lucky spawn near the answer
    do { y = 0.12 + Math.random() * 0.76; } while (Math.abs(y - TRUE_Y) < 0.12);
    flag.className = "flag playing";
    paint(y);
    $("result").hidden = true;
    $("ask").hidden = false;
    $("playBtn").hidden = true;
    $("doneBtn").hidden = false;
    $("lead").textContent = "Arrastra la línea para moverla. Cuando estés seguro, dale a Listo.";
    beep(523, 0.08, "triangle", 0.05);
    handle.focus({ preventScroll: true });
  }

  function verdictFor(s, err) {
    if (s >= 99) return "¡Uy, perfecto! Tienes ojo de cartógrafo.";
    if (s >= 92) return "¡Qué berraquera! Casi exacto.";
    if (s >= 80) return "¡Bien, parce! Muy cerquita.";
    if (s >= 60) return err < 0 ? "Le quedaste corto al amarillo." : "Te pasaste de amarillo.";
    if (Math.abs(y - 1/3) < 0.04) return "¡Ojo! No son tres franjas iguales: el amarillo es la mitad.";
    return err < 0 ? "Muy poquito amarillo. ¡El amarillo es el protagonista!" : "Demasiado amarillo, se comió el azul y el rojo.";
  }

  function finish() {
    if (state !== "playing") return;
    state = "done";
    const err = y - TRUE_Y;                       // signed, fraction of flag height
    const score = Math.max(0, 100 * (1 - Math.abs(err) * 2.5));
    lastScore = score;
    const isBest = score > best;
    if (isBest) { best = score; store.set("bc-best", String(best)); }

    flag.className = "flag done";
    $("yours").style.top = y * 100 + "%";
    $("ask").hidden = true;
    $("result").hidden = false;
    $("dev").textContent = (err >= 0 ? "+" : "−") + fmt(Math.abs(err) * 100, 1) + " pts";
    $("mine").textContent = fmt(y * 100, 1) + "% (real 50%)";
    $("verdict").textContent = verdictFor(score, err) + (isBest && rounds > 1 ? " ¡Nuevo récord!" : "");
    renderBest();
    countUp(score);
    fanfare(score);
    if (score >= 92) confetti();

    // animate stripes to the true proportions after a beat
    setTimeout(() => { flag.classList.add("anim"); const keep = y; paint(TRUE_Y); y = keep; }, 900);
  }

  function countUp(target) {
    const el = $("score"), t0 = performance.now(), dur = 900;
    const tick = (t) => {
      const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3);
      el.textContent = fmt(target * e) + "%";
      if (p < 1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }

  // ---------- confetti ----------
  function confetti() {
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const c = document.createElement("canvas"); c.className = "confetti";
    const dpr = devicePixelRatio || 1;
    c.width = innerWidth * dpr; c.height = innerHeight * dpr;
    document.body.appendChild(c);
    const g = c.getContext("2d"); g.scale(dpr, dpr);
    const cols = ["#FCD116", "#FCD116", "#003893", "#CE1126"];
    const ps = Array.from({ length: 140 }, () => ({
      x: innerWidth / 2, y: innerHeight / 3,
      vx: (Math.random() - .5) * 14, vy: Math.random() * -12 - 4,
      w: 6 + Math.random() * 8, h: 4 + Math.random() * 6,
      r: Math.random() * 6, vr: (Math.random() - .5) * .4,
      c: cols[(Math.random() * cols.length) | 0],
    }));
    let frames = 0;
    (function loop() {
      g.clearRect(0, 0, innerWidth, innerHeight);
      ps.forEach(p => {
        p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
        g.save(); g.translate(p.x, p.y); g.rotate(p.r); g.fillStyle = p.c;
        g.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); g.restore();
      });
      if (++frames < 160) requestAnimationFrame(loop); else c.remove();
    })();
  }

  // ---------- share / save ----------
  const shareText = () => `Ajusté el amarillo de la bandera de Colombia con ${fmt(lastScore)}% de precisión 🇨🇴 ¿Cuánto sacas tú?`;
  $("shareX").onclick = () => window.open("https://x.com/intent/post?text=" + encodeURIComponent(shareText()) + "&url=" + encodeURIComponent(location.href), "_blank", "noopener");
  $("shareWa").onclick = () => window.open("https://wa.me/?text=" + encodeURIComponent(shareText() + " " + location.href), "_blank", "noopener");

  $("saveBtn").onclick = () => {
    const W = 1080, H = 1350, c = document.createElement("canvas");
    c.width = W; c.height = H;
    const g = c.getContext("2d");
    g.fillStyle = "#FCD116"; g.fillRect(0, 0, W, H);
    g.fillStyle = "#fff"; g.fillRect(40, 0, W - 80, H);
    // flag with the player's guess
    const fx = 100, fy = 330, fw = 880, fh = 587;
    const rest = (1 - y) / 2;
    g.fillStyle = "#FCD116"; g.fillRect(fx, fy, fw, fh * y);
    g.fillStyle = "#003893"; g.fillRect(fx, fy + fh * y, fw, fh * rest);
    g.fillStyle = "#CE1126"; g.fillRect(fx, fy + fh * (y + rest), fw, fh * rest + 1);
    g.lineWidth = 2; g.strokeStyle = "#1a1414"; g.strokeRect(fx, fy, fw, fh);
    g.setLineDash([18, 12]); g.strokeStyle = "#fff"; g.lineWidth = 5;
    g.beginPath(); g.moveTo(fx, fy + fh / 2); g.lineTo(fx + fw, fy + fh / 2); g.stroke(); g.setLineDash([]);
    g.fillStyle = "#1a1414";
    try { g.fontStretch = "expanded"; } catch {}
    g.font = "900 104px Archivo, 'Arial Black', sans-serif"; g.textBaseline = "alphabetic";
    g.fillText("AJUSTA EL", fx, 180);
    g.fillText("AMARILLO.", fx, 280);
    g.font = "600 28px 'IBM Plex Mono', monospace";
    g.fillText("PRECISIÓN", fx, 1010);
    g.font = "900 150px Archivo, 'Arial Black', sans-serif";
    g.fillText(fmt(lastScore) + "%", fx, 1170);
    g.font = "400 28px 'IBM Plex Mono', monospace"; g.fillStyle = "#6d6666";
    g.fillText(`Mi amarillo: ${fmt(y * 100, 1)}%  ·  Real: 50%`, fx, 1235);
    g.fillText(location.host || "bandera-colombia", fx, 1285);
    const a = document.createElement("a");
    a.download = "ajusta-el-amarillo.png"; a.href = c.toDataURL("image/png"); a.click();
  };

  $("playBtn").onclick = start;
  $("againBtn").onclick = start;
  $("doneBtn").onclick = finish;

  renderSound(); renderBest(); paint(y);
})();
</script>
</body>
